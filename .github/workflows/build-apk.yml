name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Create Release Keystore & Build APK
        run: |
          cd android
          keytool -genkey -v -keystore app/release.keystore -alias caloriez -keyalg RSA -keysize 2048 -validity 10000 -storepass caloriez123 -keypass caloriez123 -dname "CN=Caloriez, OU=Mobile, O=Seitona, L=City, S=State, C=US"
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: ✍️ Sign Release APK
        run: |
          BUILD_DIR="android/app/build/outputs/apk/release"
          if [ -f "$BUILD_DIR/app-release-unsigned.apk" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks android/app/release.keystore \
              --ks-pass pass:caloriez123 \
              --key-pass pass:caloriez123 \
              --ks-key-alias caloriez \
              --out "$BUILD_DIR/Caloriez-Release.apk" \
              "$BUILD_DIR/app-release-unsigned.apk"
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caloriez-Release-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
